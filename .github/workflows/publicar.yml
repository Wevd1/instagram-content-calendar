name: Publicar posts aprovados

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0,3,6,9 13 * * *"
  workflow_dispatch:
    inputs:
      testar:
        description: "Só testar: o Instagram processa a mídia, mas nada é publicado"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Processar posts aprovados
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          MODO: ${{ inputs.testar && '--check' || '--publish' }}
        run: node scripts/publish.mjs $MODO

      - name: Salvar status no calendário
        run: |
          if ! git diff --quiet calendar.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar.json
            git commit -m "Atualiza status dos posts"
            git push
          fi
